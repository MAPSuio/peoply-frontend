version: 2

updates:
  # Minor and patch bumps are grouped into one PR per ecosystem per week.
  # Ungrouped they arrive at roughly twenty PRs a month, which is the reliable
  # way to make nobody read any of them.
  #
  # Majors are deliberately left ungrouped: they land as one PR each, because
  # they are the ones that need a changelog read before merging.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits, matching commitlint.config.js. Dependabot commits
      # through the API and so never runs the commit-msg hook, but a history
      # where only the bot's commits break the convention is a history where
      # `git log --grep` and any future changelog tooling quietly miss them.
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Listed first: a dependency joins the first group it matches, and these
      # have to move together regardless of update type. vitest pins the Vite
      # major, and anything sharing that tree has to agree with it - the first
      # attempt at bumping @vitejs/plugin-react alone (#17) could not install
      # at all, because it wanted a Vite major that vitest did not accept.
      test-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
          - jsdom
          - "@testing-library/*"
      # Also first, and for the same reason. React 19 has landed, so the ignore
      # block that kept the bot off it is gone - but the four packages still
      # have to move together, and a React minor would otherwise be swallowed
      # by production-minor-and-patch below and split from its @types.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The workflow pins actions by major (actions/checkout@v4,
  # digitalocean/app_action/deploy@v2), so this only fires for a new major -
  # rarely, and worth looking at when it does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
