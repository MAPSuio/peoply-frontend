# Kodehelse på diffen: død kode, ubrukte eksporter og dependencies,
# kompleksitet og duplisering. Kun funn PR-en selv innfører feiler jobben —
# arvet gjeld rapporteres, men blokkerer ikke. Det er derfor den kan stå på i
# et repo som ikke er ryddet ferdig.
name: Code Health

on:
  workflow_dispatch:
  # Bevisst ufiltrert, av samme grunn som i ci.yml: `branches:` filtrerer på
  # PR-ens base, så stablede PR-er ville stått uten sjekker.
  pull_request:

concurrency:
  group: code-health-${{ github.ref }}
  cancel-in-progress: true

# Jobben leser bare kode. Uten dette arver den standard-tokenet, som kan være
# vidt åpent avhengig av repo-innstillingene.
permissions:
  contents: read

jobs:
  code-health:
    name: Code Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # audit sammenligner mot merge-base, så den trenger full historikk.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Nødvendig for at fallow skal kunne resolve imports til faktiske pakker.
      - run: npm ci

      # Basen går via env, ikke inline-interpolering, så et grennavn aldri kan
      # tolkes som shell.
      #
      # --max-crap står her og ikke bare i .fallowrc.json fordi health.maxCrap
      # ikke slår gjennom til audit i fallow 3.15.0 — bare flagget gjør det.
      # Begrunnelsen for verdien ligger i .fallowrc.json.
      #
      # Versjonen er pinnet med vilje. Bump bevisst: nye versjoner finner nye
      # ting og kan gjøre grønne PR-er røde.
      - env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: npx --yes fallow@3.15.0 audit --base "origin/$BASE_REF" --max-crap 500
