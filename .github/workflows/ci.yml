name: CI

on:
  # Deliberately unfiltered. `branches:` on pull_request filters by the PR's
  # *base* branch, so restricting it to master/main gave stacked PRs - one
  # feature branch based on another - no checks at all. Not a red X: no runs,
  # nothing to wait for, and a mergeable-looking PR that nothing ever built.
  # Every PR gets checks; the push filter below is what gates the deploy.
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Biome checks formatting and lints; stylelint still owns the SCSS.
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # build:prod prunes devDependencies after the build, and booting the
      # pruned tree is what proves the runtime needs none of them - a dev
      # package that next start loads fails this job instead of the deploy.
      - run: npm run build:prod
        env:
          NEXT_PUBLIC_BASE_URL: https://example.com
          NEXT_PUBLIC_API_URL: https://example.com/api
          BLOB_DOMAIN: example.com

      - name: Boot the pruned build
        run: |
          node node_modules/next/dist/bin/next start --port 3999 &
          SERVER_PID=$!
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3999/; then
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null
          echo "next start never answered on the pruned tree"
          exit 1

  # Deploys prod only after every check above is green. The App Platform app is
  # referenced by name, so the spec stays in DigitalOcean rather than in this
  # repo; it holds production env vars that must not be committed here.
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [typecheck, lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-prod-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: prod-peoply-frontend
          print_build_logs: true
          print_deploy_logs: true
