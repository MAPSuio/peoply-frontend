name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Biome checks formatting and lints; stylelint still owns the SCSS.
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://example.com
          NEXT_PUBLIC_API_URL: https://example.com/api
          BLOB_DOMAIN: example.com

  # Deploys prod only after every check above is green. The App Platform app is
  # referenced by name, so the spec stays in DigitalOcean rather than in this
  # repo; it holds production env vars that must not be committed here.
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [typecheck, lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-prod-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: prod-peoply-frontend
          print_build_logs: true
          print_deploy_logs: true
